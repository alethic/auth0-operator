apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auth0-operator-role
  labels:
    {{- include "auth0-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "auth0-operator.annotations" . | nindent 4 }}
rules:
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - brandingthemes
  - clients
  - clientgrants
  - connectionclients
  - customdomains
  - customtexts
  - resourceservers
  - roles
  verbs:
  - '*'
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - tenants
  - connections
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - '*'
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - '*'
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - clients
  - resourceservers
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - create
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - brandingthemes/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - tenants/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - kubernetes.auth0.com
  resources:
  - clients/status
