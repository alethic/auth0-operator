_: {}

## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""

## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""

## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}

## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}

## @param clusterDomain Kubernetes cluster domain name
##
clusterDomain: cluster.local

## @param crds Options for installing Custom Resource Definitions (CRDs)
crds:
  ## @param enabled Whether to install the Custom Resource Definitions (CRDs) during chart installation.
  enabled: true
  ## @param keep Whether to retain CRDs when the chart is uninstalled.
  keep: false

operator:
  env: []

  # An array of additional annotations to be applied to the operator service account
  serviceAccountAnnotations: []

  # Specify the Operator container image to use for the deployment.
  image:
    repository: ghcr.io/alethic/auth0-operator-image
    pullPolicy: IfNotPresent

  # An array of Kubernetes secrets to use for pulling images from a private ``image.repository``.
  # Only one array element is supported at this time.
  imagePullSecrets: [ ]

  # An array of `initContainers <https://kubernetes.io/docs/concepts/workloads/pods/init-containers/>`__ to start up before the Operator pods.
  initContainers: [ ]

  # The number of Operator pods to deploy.
  replicaCount: 1

  # You may need to modify these values to meet your cluster's security and access settings.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000

  # You may need to modify these values to meet your cluster's security and access settings.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # The volumes must exist *and* be accessible to the Operator pods.
  volumes: []

  # An array of volume mount points associated to each Operator container.
  volumeMounts: []

  # Any `Node Selectors <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/>`__ to apply to Operator pods.
  nodeSelector: { }

  # The `Pod Priority <https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/>`__ to assign to Operator pods.
  priorityClassName: ""

  # The `affinity <https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/>`__ or anti-affinity settings to apply to Operator pods.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: name
                operator: In
                values:
                  - auth0-operator
          topologyKey: kubernetes.io/hostname

  # An array of `Toleration labels <https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/>`__ to associate to Operator pods.
  tolerations: [ ]

  # An array of `Topology Spread Constraints <https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/>`__ to associate to Operator pods.
  topologySpreadConstraints: [ ]

  # The `Requests or Limits <https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/>`__ for resources to associate to Operator pods.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

# Various configuration options.
options:
    # Limit operation to the single specified namespace. This can be used to install a namespace-specific instance of the operator.
    # NOT YET SUPORTED
    #namespace:
  reconciliation:
    interval:
    retryInterval:
    # The maximum number of resources reconciled in parallel. Bounds the burst of Auth0 API calls on startup. Default: 4.
    maxParallelReconciliations:
  # Client-side rate limiting of Auth0 Management API requests (a per-domain token bucket). Keeps the operator within
  # Auth0's per-tenant rate limits and backpressures the reconcile loop. Leave values empty to use the defaults below.
  rateLimit:
    # Whether client-side rate limiting is applied. Default: true.
    enabled:
    # Burst capacity: requests allowed immediately before throttling. Default: 10.
    tokenLimit:
    # Sustained rate: tokens (requests) replenished each replenishmentPeriod. Default: 5.
    tokensPerPeriod:
    # How often tokens replenish, as a duration (e.g. "00:00:01"). Default: 1s.
    replenishmentPeriod:
    # Maximum requests allowed to wait for a token before failing fast. Default: 10000.
    queueLimit:
    # Circuit breaker: when Auth0 answers any request with a 429, all requests to that domain fail fast until the
    # server-reported rate limit reset instead of every reconcile discovering the rate limit on its own.
    circuitBreaker:
      # Whether the circuit breaker is applied. Default: true.
      enabled:
      # How long the breaker stays open when a 429 carries no usable reset header, as a duration. Default: "00:01:00".
      defaultOpenDuration:
      # Upper bound on how long the breaker stays open, guarding against clock skew. Default: "00:10:00".
      maxOpenDuration:
    # Adaptive pacing: as Auth0's reported remaining budget depletes, outbound requests are delayed so the rest of
    # the budget is spread across the time until the reset — consumption slows to Auth0's refill rate instead of
    # draining the bucket and tripping the circuit breaker.
    pacing:
      # Whether adaptive pacing is applied. Default: true.
      enabled:
      # The remaining budget at or below which pacing begins. Default: 10.
      remainingThreshold:
      # Upper bound on the delay applied to a single request, as a duration. Default: "00:00:10".
      maxRequestDelay:
